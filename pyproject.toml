[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsenet"
version = "1.0.0"
description = "Correlation-threshold network analysis of the Indian stock market (Nifty 500)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biswadeep Chakraborty" }]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "networkx>=3.1",
    "matplotlib>=3.7", "pyyaml>=6.0", "requests>=2.31", "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
